<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            background: white;
        }

        h2 {
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 220px;
            text-align: center;
            padding: 16px
        }

        .avatar {
            width: 70px;
            height: 70px;
            background-color: rgb(61, 103, 242);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin: 0 auto 12px;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
        }

        .detail {
            font-size: 14px;
            color: rgb(16, 16, 15);
            margin: 2px 0;
        }
    </style>
</head>

<body>
    <h2> Student Profile Card</h2>
    <div class="container">
        <div class="card">
            <div class="avatar">JK</div>
            <div class="name"> Jeet Kumar</div>
            <div class="detail"> B.tech CSE</div>
            <div class="detail">Roll no.=21CS1007</div>
            <div class="detail"> 1st year</div>
        </div>
        <div class="card">
            <div class="avatar">AR</div>
            <div class="name"> Asha Rani</div>
            <div class="detail"> B.tech CSE</div>
            <div class="detail">Roll no.=21IT1012</div>
            <div class="detail"> 1st year</div>
        </div>

        <div class="card">
            <div class="avatar">RK</div>
            <div class="name"> Rohit Kumar</div>
            <div class="detail"> B.tech CSE</div>
            <div class="detail">Roll no.=21EC1009</div>
            <div class="detail"> 1st year</div>
        </div>


</body>

</html>
